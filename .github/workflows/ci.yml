name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTSIM_WERROR=ON -DTSIM_SANITIZE=ON
        env:
          CC: ${{ matrix.cc }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The README promises macOS, whose headers are not glibc's: <stdlib.h> brings in <sys/wait.h>,
  # and with it a `union wait` that a Linux build never sees.
  macos:
    name: test (macos, clang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTSIM_WERROR=ON -DTSIM_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The acceptance bar for the simulator core: a 1000-node, one-hour run finishes in minutes, so the
  # comparison can be swept over seeds and parameters. Locally it takes about 7 s; the budget leaves
  # room for a slower runner, not for a slower simulator.
  scale:
    name: scale (1000 nodes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build
      - name: Run scenarios/scale/region.tsim within 60 s
        run: timeout 60 ./build/tsim scenarios/scale/region.tsim
      - name: Run scenarios/scale/region-meshtastic.tsim within 60 s
        run: timeout 60 ./build/tsim scenarios/scale/region-meshtastic.tsim

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run --Werror $(git ls-files '*.c' '*.h')
