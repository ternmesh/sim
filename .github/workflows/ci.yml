name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The commit of ternmesh/firmware the `core` routing is built from (tsim/core.h). Moved on by hand,
# so that a change to the firmware cannot fail a check here that it has not been run against.
env:
  FIRMWARE_REF: be73ae4c040f9121611a5251e6165d90fcb3d28e

jobs:
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ternmesh/firmware
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTSIM_WERROR=ON -DTSIM_SANITIZE=ON
          -DTSIM_FIRMWARE_DIR=$PWD/firmware -DTSIM_REQUIRE_CORE=ON
        env:
          CC: ${{ matrix.cc }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The README promises macOS, whose headers are not glibc's: <stdlib.h> brings in <sys/wait.h>,
  # and with it a `union wait` that a Linux build never sees.
  macos:
    name: test (macos, clang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ternmesh/firmware
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware
      - run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DTSIM_WERROR=ON -DTSIM_SANITIZE=ON
          -DTSIM_FIRMWARE_DIR=$PWD/firmware -DTSIM_REQUIRE_CORE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The acceptance bar for the simulator core: a 1000-node, one-hour run finishes in minutes, so the
  # comparison can be swept over seeds and parameters. Locally the slowest takes about 25 s, its six
  # hours of warmup included, three of them carrying traffic, and a runner about twice that; the
  # budget leaves room for a slower runner, not a slower simulator.
  scale:
    name: scale (1000 nodes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ternmesh/firmware
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DTSIM_FIRMWARE_DIR=$PWD/firmware -DTSIM_REQUIRE_CORE=ON
      - run: cmake --build build
      - name: Run scenarios/scale/region.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region.tsim
      - name: Run scenarios/scale/region-meshtastic.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-meshtastic.tsim
      - name: Run scenarios/scale/region-meshcore.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-meshcore.tsim
      - name: Run scenarios/scale/region-distvec.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-distvec.tsim
      - name: Run scenarios/scale/region-deployed.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-deployed.tsim
      - name: Run scenarios/scale/region-meshtastic-deployed.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-meshtastic-deployed.tsim
      - name: Run scenarios/scale/region-meshcore-deployed.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-meshcore-deployed.tsim
      - name: Run scenarios/scale/region-distvec-deployed.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-distvec-deployed.tsim
      - name: Run scenarios/scale/region-fast.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-fast.tsim
      - name: Run scenarios/scale/region-meshtastic-fast.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-meshtastic-fast.tsim
      - name: Run scenarios/scale/region-meshcore-fast.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-meshcore-fast.tsim
      - name: Run scenarios/scale/region-distvec-fast.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-distvec-fast.tsim
      - name: Run scenarios/scale/region-core.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-core.tsim
      - name: Run scenarios/scale/region-core-deployed.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-core-deployed.tsim
      - name: Run scenarios/scale/region-core-fast.tsim within 120 s
        run: timeout 120 ./build/tsim scenarios/scale/region-core-fast.tsim

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - run: clang-format-18 --dry-run --Werror $(git ls-files '*.c' '*.h')
