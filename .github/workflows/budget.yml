name: Budget

# The firmware's own airtime budget (the specification's draft/airtime.md), measured through the
# core: tools/density.py --candidates core with airtime.budget off and on, its own code holding
# and dropping frames (tsim/core.h, budget_on), on GitHub's runners rather than someone's laptop.
# One job per preset and load; each puts both tables in the run's summary and its JSON in an
# artifact. Run it from the Actions tab once this file is on main, or on a pull request by adding
# the `budget` label.
#
# The loads are docs/airtime.md's: the comparison's (a message from every node every half hour),
# six times that, and a twentieth of the nodes writing a message every 10 seconds, whose `quiet`
# columns are what everyone else delivered.

on:
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: ternmesh/firmware commit, branch or tag to build the core from
        required: true
        default: main
      seeds:
        description: density.py --seeds
        default: "3"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  budget:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'budget'
    name: budget (${{ matrix.preset }}, ${{ matrix.load.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        preset: [fast, deployed]
        load:
          - name: comparison
          - name: heavy
            a: traffic.interval=5 min
          - name: chatty
            a: traffic.chatty=0.05
            b: traffic.chatty_interval=10 s
    env:
      FIRMWARE_REF: ${{ inputs.firmware_ref || 'main' }}
      SEEDS: ${{ inputs.seeds || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ternmesh/firmware
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DTSIM_FIRMWARE_DIR=$PWD/firmware -DTSIM_REQUIRE_CORE=ON
      - run: cmake --build build
      - name: tools/density.py, budget off and on
        env:
          PRESET: ${{ matrix.preset }}
          LOAD: ${{ matrix.load.name }}
          A: ${{ matrix.load.a }}
          B: ${{ matrix.load.b }}
        # Each of the load's settings is one -s argument, spaces and all: "traffic.interval=5 min".
        run: |
          set -o pipefail
          sets=()
          if [ -n "$A" ]; then sets+=(-s "$A"); fi
          if [ -n "$B" ]; then sets+=(-s "$B"); fi
          {
            echo "### density.py --$PRESET --candidates core, $LOAD load, firmware $FIRMWARE_REF"
          } >> "$GITHUB_STEP_SUMMARY"
          for b in off on; do
            python3 tools/density.py --tsim build/tsim --"$PRESET" --quick --candidates core \
              --seeds "$SEEDS" --power=-5,0,20 --jobs "$(nproc)" \
              --json "budget-$PRESET-$LOAD-$b.json" -s "airtime.budget=$b" "${sets[@]}" \
              | tee "budget-$PRESET-$LOAD-$b.txt"
            {
              echo "airtime.budget=$b"
              echo '```'
              cat "budget-$PRESET-$LOAD-$b.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: budget-${{ matrix.preset }}-${{ matrix.load.name }}
          path: budget-${{ matrix.preset }}-${{ matrix.load.name }}-*
